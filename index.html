<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-5 수행평가 대시보드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header>
            <h1>1-5 수행평가</h1>
        </header>

        <!-- 메인 콘텐츠 영역 (2열 레이아웃) -->
        <div class="main-content">
            <!-- 왼쪽: 수행평가 목록 및 입력 -->
            <section class="left-section card">
                <div class="section-header">
                    <h2>수행평가 목록</h2>
                    <div class="filter-group">
                        <label for="sort-select">정렬:</label>
                        <select id="sort-select">
                            <option value="date">일정순</option>
                            <option value="subject">과목별</option>
                        </select>
                    </div>
                </div>

                <!-- 등록 폼 -->
                <form id="eval-form" class="input-form">
                    <input type="text" id="eval-subject" placeholder="과목 (예: 국어)" required>
                    <input type="text" id="eval-title" placeholder="수행평가 내용" required>
                    <input type="date" id="eval-date" required>
                    <button type="submit">추가</button>
                </form>

                <!-- 리스트 -->
                <ul id="eval-list" class="item-list"></ul>
            </section>

            <!-- 오른쪽: 일정 (달력) -->
            <section class="right-section card">
                <div class="section-header">
                    <h2>일정</h2>
                    <span class="legend"><span class="badge">●</span> : 수행 있는 날</span>
                </div>
                <div id="calendar" class="calendar-grid"></div>
            </section>
        </div>

        <!-- 하단: 1-5 기사 작성 영역 -->
        <section class="bottom-section card">
            <h2>1-5 기사</h2>
            
            <form id="news-form" class="input-form">
                <input type="text" id="news-author" placeholder="작성자" style="width: 120px;" required>
                <input type="text" id="news-content" placeholder="기사 내용을 입력하세요..." required style="flex: 1;">
                <button type="submit">기사 등록</button>
            </form>

            <ul id="news-list" class="news-list"></ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
